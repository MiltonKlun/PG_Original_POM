[pytest]
addopts = --strict-markers --strict-config --tracing=retain-on-failure --video=retain-on-failure --screenshot=only-on-failure --output=test-results
# Run headed locally: python -m pytest --headed
testpaths = tests
markers =
    smoke: Critical health checks.
    shop: Shopping UI journeys.
    auth: Authentication tests.
    contact: Contact form tests.
    mock_only: Simulation-only behavior, never selected on live.
    live_safe: Observed non-submitting live behavior.
    framework: Offline framework checks, no browser/server required.
    contract: Read-only locator contract shared by mock and live.
    a11y: Accessibility checks (axe-core scans and keyboard operation).
    live_defect(reason): Known store defect; expected to fail on live (strict xfail).

log_cli = false
log_level = INFO
log_file_level = INFO
log_format = %(asctime)s %(levelname)s %(name)s %(message)s
