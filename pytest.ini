[pytest]
addopts = --strict-markers --strict-config --browser chromium --video=retain-on-failure --screenshot=only-on-failure --output=test-results
# Run headed locally: python -m pytest --headed
testpaths = tests
markers =
    smoke: Critical health checks.
    integration: Core business flows.
    auth: Authentication tests.
    contact: Contact form tests.
    interactive: Tests requiring manual verification or blocked by bots in CI.
