name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security (dependencies and workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-security.txt
      - run: python -m pip install -r requirements-security.txt
      - run: python -m pip check
      - name: Known vulnerabilities in locked dependencies
        run: |
          python -m pip_audit -r requirements-dev.txt --progress-spinner off
          python -m pip_audit -r requirements-security.txt --progress-spinner off
      - name: Workflow security analysis
        run: zizmor --offline --persona=auditor .github/workflows/
