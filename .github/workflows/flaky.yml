name: Flaky test check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flaky:
    name: Flaky test check (Chromium, mock)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET: mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      # Five full runs, no retries: any test whose outcome changes is reported.
      - run: python scripts/flaky_check.py --runs 5 --workers auto --output reports/flaky
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: flaky-${{ github.run_attempt }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn
