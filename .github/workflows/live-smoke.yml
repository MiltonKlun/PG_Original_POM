name: Live read-only smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  live-smoke:
    name: Live smoke (Chromium, non-required)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET: live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests -m "smoke and live_safe" --browser chromium --run-id live-chromium
      - name: Summarize results
        if: always()
        run: python scripts/ci_summary.py reports/live-chromium/summary.json
      # Raw live traces/video/logs may contain client/session data: keep private.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: live-chromium-${{ github.run_attempt }}
          path: reports/
          retention-days: 14
          if-no-files-found: error
