name: Mock CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            report-id: quality-ubuntu
          - os: windows-latest
            report-id: quality-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      TARGET: mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip check
      - run: python -m black --check conftest.py config pages components tests scripts
      - run: python -m flake8 conftest.py config pages components tests scripts
      - run: python -m pytest tests/framework --run-id ${{ matrix.report-id }}
      - name: Summarize results
        if: always()
        run: python scripts/ci_summary.py reports/${{ matrix.report-id }}/summary.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: quality-${{ matrix.os }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 14
          if-no-files-found: error

  mock-ui:
    name: Mock UI (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET: mock
      MOCK_CONTAINER: pgoriginal-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Start Docker mock
        run: |
          docker build -t pgoriginal-mock mock_site
          docker run -d --name "$MOCK_CONTAINER" -p 127.0.0.1:8090:80 pgoriginal-mock
          python -c "from scripts.serve_mock import verify_mock; verify_mock('http://127.0.0.1:8090')"
      - run: python -m pytest tests -m "not framework" --base-url http://127.0.0.1:8090 --browser chromium --run-id mock-chromium
      - name: Summarize results
        if: always()
        run: python scripts/ci_summary.py reports/mock-chromium/summary.json
      - name: Collect server logs and stop owned container
        if: always()
        run: |
          mkdir -p logs
          if docker container inspect "$MOCK_CONTAINER" >/dev/null 2>&1; then
            docker logs "$MOCK_CONTAINER" > logs/mock-server.log 2>&1
            docker rm -f "$MOCK_CONTAINER"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mock-chromium-${{ github.run_attempt }}
          path: |
            reports/
            test-results/
            logs/
          retention-days: 14
          if-no-files-found: error
