name: Snapshot refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'

permissions:
  contents: read

# One live run at a time, shared with the live smoke workflow.
concurrency:
  group: live-store
  cancel-in-progress: false

jobs:
  refresh:
    name: Re-record live store and compare (non-required)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write # open or update the drift issue
    env:
      FRESH: reports/snapshot-fresh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Record the live store (read-only, serial)
        run: python -m scripts.snapshot record --output "$FRESH/pgoriginal.har"
      - name: Compare page-object selectors with the committed snapshot
        run: python -m scripts.snapshot compare "$FRESH/pgoriginal.har" --output "$FRESH"
      - name: Replay the suite on the fresh recording
        if: always()
        env:
          TARGET: snapshot
        run: >-
          python -m pytest tests -m "not framework" -n auto --browser chromium
          --snapshot-har "$FRESH/pgoriginal.har" --run-id snapshot-replay
      - name: Summarize replay
        if: always()
        run: python scripts/ci_summary.py reports/snapshot-replay/summary.json
      - name: Open or update the drift issue
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            cat "$FRESH/drift.md" 2>/dev/null || echo "The selector comparison did not complete."
            echo
            echo "Recording, inventories and replay report: $RUN_URL"
          } > issue.md
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "Snapshot drift in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file issue.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Snapshot drift: live store markup changed" --body-file issue.md
          fi
      # The sanitized recording and reports only: raw recordings keep cookies.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: snapshot-refresh-${{ github.run_attempt }}
          path: |
            reports/snapshot-fresh/
            reports/snapshot-replay/
            reports/snapshot-record-*/summary.json
          retention-days: 14
          if-no-files-found: error
